name: FamilyWealthApp
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0

targets:
  FamilyWealthApp:
    type: application
    platform: auto
    supportedDestinations:
      - iOS
    deploymentTarget: "17.0"
    sources:
      - path: FamilyWealthApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.familycap
        PRODUCT_NAME: FamilyCap
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FamilyCap
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Discover nearby family devices to share household data.
        INFOPLIST_KEY_NSBonjourServices:
          - _fwsyncshare._tcp
